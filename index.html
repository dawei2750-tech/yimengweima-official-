<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="以梦为马 · 高定婚礼策展系统" />
    <title>以梦为马 | DREAM AS HORSE</title>
    <link rel="preload" as="image" href="./assets/hero-gallery-bg.jpg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas id="particle-canvas" class="particle-canvas" aria-hidden="true"></canvas>
    <div class="scene-glow scene-glow-a"></div>
    <div class="scene-glow scene-glow-b"></div>

    <main class="shell">
      <aside class="rail" aria-label="主导航">
        <button class="spark-button" aria-label="以梦为马"></button>
        <nav>
          <a href="#inspiration" class="active"><span></span>灵感档案<small>INSPIRATION</small></a>
          <a href="#console"><span></span>婚礼控制台<small>CONSOLE</small></a>
          <a href="#invitation"><span></span>电子请柬<small>E-INVITATION</small></a>
          <a href="#collab"><span></span>亲密协同<small>COLLABORATION</small></a>
        </nav>
      </aside>

      <section class="hero" id="inspiration">
        <div class="hero-bg-image" aria-hidden="true"></div>
        <img class="hero-horse-image" src="./assets/hero-dream-horse.png" alt="" />
        <header class="topbar">
          <div class="brand-lockup">
            <div class="brand-mark">
              <img src="./assets/logo-light-horse.png" alt="" />
            </div>
            <div>
              <strong>以梦为马</strong>
              <span>DREAM AS HORSE</span>
            </div>
          </div>
          <div class="top-actions">
            <button>LOGIN</button>
            <button>CONTACT</button>
          </div>
        </header>

        <div class="hero-stage">
          <div class="hero-horse" aria-hidden="true">
            <div class="horse-line line-a"></div>
            <div class="horse-line line-b"></div>
            <div class="horse-line line-c"></div>
            <div class="horse-core"></div>
          </div>

          <p class="kicker">LIGHT FLOW WEDDING EXPERIENCE</p>
          <h1>DREAM AS HORSE</h1>
          <p class="subtitle">以梦为马 · 高定婚礼策展系统</p>
          <button class="magnetic-cta" type="button">
            <span>进入体验</span>
            <i>→</i>
          </button>
        </div>

        <div class="side-orbit" aria-hidden="true">
          <span>光标追随</span>
          <strong>星尘共舞</strong>
        </div>

        <section class="card-deck" aria-label="高定婚礼灵感">
          <article class="experience-card active" data-depth="1.8">
            <img class="card-image" src="./assets/card-light-flow-horse.jpg" alt="" />
            <div class="card-sheen" aria-hidden="true"></div>
            <span>01</span>
            <h2>流光梦马</h2>
            <p>LIGHT FLOW HORSE</p>
            <button aria-label="查看流光梦马">→</button>
          </article>
          <article class="experience-card rose" data-depth="1.2">
            <img class="card-image" src="./assets/card-dark-rose.jpg" alt="" />
            <div class="card-sheen" aria-hidden="true"></div>
            <span>02</span>
            <h2>暗夜玫瑰</h2>
            <p>DARK ROSE</p>
            <button aria-label="查看暗夜玫瑰">→</button>
          </article>
          <article class="experience-card dome" data-depth="1.5">
            <img class="card-image" src="./assets/card-silver-dome.jpg" alt="" />
            <div class="card-sheen" aria-hidden="true"></div>
            <span>03</span>
            <h2>银白穹顶</h2>
            <p>SILVER DOME</p>
            <button aria-label="查看银白穹顶">→</button>
          </article>
          <article class="experience-card gallery" data-depth="1.1">
            <img class="card-image" src="./assets/card-art-gallery.jpg" alt="" />
            <div class="card-sheen" aria-hidden="true"></div>
            <span>04</span>
            <h2>美术馆婚礼</h2>
            <p>ART GALLERY</p>
            <button aria-label="查看美术馆婚礼">→</button>
          </article>
        </section>

        <footer class="micro-footer">
          <span>滚动探索</span>
          <div class="timeline"><i></i></div>
          <span>触摸卡片 · 光轨响应</span>
        </footer>
      </section>
    </main>

    <script src="./main.js"></script>
  </body>
</html>
